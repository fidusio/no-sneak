@accentColor=#5856D6

# Softer, more modern component shapes
Button.arc=12
Component.arc=12
TextComponent.arc=10
ScrollBar.thumbArc=999
ScrollBar.width=10

# Breathing room inside inputs & buttons
Button.margin=6,16,6,16
# No focus ring outside the controls (2026-11-06; it was 1). FlatLaf hands the focus width to MigLayout as every
# button's visual padding, and MigLayout clamps that padding at the container's edge: a button that ends a row
# flush with its container (the page heads' New scan, the command row's Stop, the Copy beside it) was laid out
# that much narrower than it asked for and its text was clipped with an ellipsis ("New sc...", "St..."). Keyboard
# focus is still shown, by the border colour (focusedBorderColor). The macOS Dark palette's own 2 is overridden
# here too: this file is read after FlatLaf's own, for every theme.
Component.focusWidth=0
TextComponent.margin=4,8,4,8

# Quieter dividers (the border colour is per theme: FlatLightLaf.properties / FlatDarkLaf.properties)
SplitPaneDivider.gripDotCount=0


TitlePane.unifiedBackground=false
TitlePane.buttonSize=35,23