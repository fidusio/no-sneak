# no-sneak dark (2026-11-02): FlatLaf loads this file for every look and feel that extends
# FlatDarkLaf, which the app's Dark (FlatMacDarkLaf) does. The xlogistx.* keys are the tokens gui-audio's UITokens reads first (xlogistx.border
# needs the {color} prefix: FlatLaf would read a key ending in "border" as a Border); without them the
# tokens fall back to the light design and chips, badges and cards stay light on a dark page.
# Surfaces step up from @background (the page ground); the strong colours read on the soft tints.
TitlePane.background=lighten(@background,5%)

xlogistx.accent=@accentColor
xlogistx.accentSoft=mix(@accentColor,@background,30%)
xlogistx.accentText=lighten(@accentColor,18%)
xlogistx.text=@foreground
xlogistx.muted=shade(@foreground,32%)
xlogistx.border={color}tint(@background,19%)
xlogistx.surface=tint(@background,6%)
xlogistx.surfaceAlt=tint(@background,3%)
xlogistx.ground=@background
xlogistx.ok=#6CCB93
xlogistx.okSoft=mix(#1B7A48,@background,35%)
xlogistx.warn=#E8B04E
xlogistx.warnSoft=mix(#8A5200,@background,40%)
xlogistx.danger=#F2857B
xlogistx.dangerSoft=mix(#B42318,@background,35%)
xlogistx.neutral=shade(@foreground,15%)
xlogistx.neutralSoft=tint(@background,11%)

# keys read ad hoc through UITokens.color(key, null, fallback), light-only fallbacks: the command
# field and the header chip (xlogistx.chip), the sidebar hover (xlogistx.navHover)
xlogistx.chip=tint(@background,10%)
xlogistx.navHover=tint(@background,8%)
